<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" font-family="'Courier New', monospace">

  <!-- Background -->
  <rect width="760" height="520" fill="#1a1e2e"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">ESP-A v1.5 — 4-Relay Load Wiring (Front)</text>

  <!-- +12V load rail -->
  <line x1="373" y1="50" x2="585" y2="50" stroke="#e74c3c" stroke-width="3"/>
  <text x="368" y="45" font-size="10" fill="#e74c3c" text-anchor="end" font-weight="bold">+12V</text>
  <text x="368" y="57" font-size="9" fill="#a33" text-anchor="end">(batt +)</text>

  <!-- GND load rail -->
  <line x1="373" y1="490" x2="585" y2="490" stroke="#5a6270" stroke-width="3"/>
  <text x="368" y="494" font-size="10" fill="#5a6270" text-anchor="end">GND (batt −)</text>

  <!-- ESP32-A -->
  <rect x="20" y="158" width="118" height="245" rx="6" fill="#162844" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="79" y="177" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">ESP32-A</text>

  <circle cx="138" cy="200" r="3.5" fill="#3b82f6"/>
  <text x="130" y="197" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 17</text>
  <text x="130" y="208" font-size="8" fill="#4a6fa5" text-anchor="end">Ch1</text>

  <circle cx="138" cy="273" r="3.5" fill="#3b82f6"/>
  <text x="130" y="270" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 16</text>
  <text x="130" y="281" font-size="8" fill="#4a6fa5" text-anchor="end">Ch2</text>

  <circle cx="138" cy="346" r="3.5" fill="#3b82f6"/>
  <text x="130" y="343" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 14</text>
  <text x="130" y="354" font-size="8" fill="#4a6fa5" text-anchor="end">Ch3</text>

  <circle cx="138" cy="419" r="3.5" fill="#3b82f6"/>
  <text x="130" y="416" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 27</text>
  <text x="130" y="427" font-size="8" fill="#4a6fa5" text-anchor="end">Ch4</text>

  <!-- RELAY 1 (center y=200) -->
  <rect x="240" y="170" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="196" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 1</text>
  <text x="300" y="209" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch1 / GPIO 17</text>
  <circle cx="240" cy="200" r="3" fill="#4ade80"/>
  <text x="244" y="197" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="186" r="3" fill="#e74c3c"/>
  <text x="365" y="190" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="208" r="3" fill="#f97316"/>
  <text x="365" y="212" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 2 (center y=273) -->
  <rect x="240" y="243" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="269" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 2</text>
  <text x="300" y="282" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch2 / GPIO 16</text>
  <circle cx="240" cy="273" r="3" fill="#4ade80"/>
  <text x="244" y="270" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="259" r="3" fill="#e74c3c"/>
  <text x="365" y="263" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="281" r="3" fill="#f97316"/>
  <text x="365" y="285" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 3 (center y=346) -->
  <rect x="240" y="316" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="342" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 3</text>
  <text x="300" y="355" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch3 / GPIO 14</text>
  <circle cx="240" cy="346" r="3" fill="#4ade80"/>
  <text x="244" y="343" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="332" r="3" fill="#e74c3c"/>
  <text x="365" y="336" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="354" r="3" fill="#f97316"/>
  <text x="365" y="358" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 4 (center y=419) -->
  <rect x="240" y="389" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="415" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 4</text>
  <text x="300" y="428" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch4 / GPIO 27</text>
  <circle cx="240" cy="419" r="3" fill="#4ade80"/>
  <text x="244" y="416" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="405" r="3" fill="#e74c3c"/>
  <text x="365" y="409" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="427" r="3" fill="#f97316"/>
  <text x="365" y="431" font-size="8" fill="#f97316">NO</text>

  <!-- SIGNAL WIRES (GPIO to IN, blue) -->
  <line x1="138" y1="200" x2="240" y2="200" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="273" x2="240" y2="273" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="346" x2="240" y2="346" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="419" x2="240" y2="419" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- +12V DAISY CHAIN -->
  <!-- Drop from rail to R1 COM -->
  <line x1="373" y1="50" x2="373" y2="186" stroke="#e74c3c" stroke-width="2"/>
  <line x1="360" y1="186" x2="373" y2="186" stroke="#e74c3c" stroke-width="2"/>
  <!-- Jumper R1 to R2 -->
  <line x1="373" y1="186" x2="373" y2="259" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="259" x2="373" y2="259" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Jumper R2 to R3 -->
  <line x1="373" y1="259" x2="373" y2="332" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="332" x2="373" y2="332" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Jumper R3 to R4 -->
  <line x1="373" y1="332" x2="373" y2="405" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="405" x2="373" y2="405" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- LIGHTS -->
  <circle cx="540" cy="200" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="186" x2="554" y2="214" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="186" x2="526" y2="214" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="234" text-anchor="middle" font-size="9" fill="#fbbf24">Light 1</text>

  <circle cx="540" cy="273" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="259" x2="554" y2="287" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="259" x2="526" y2="287" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="307" text-anchor="middle" font-size="9" fill="#fbbf24">Light 2</text>

  <circle cx="540" cy="346" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="332" x2="554" y2="360" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="332" x2="526" y2="360" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="380" text-anchor="middle" font-size="9" fill="#fbbf24">Light 3</text>

  <circle cx="540" cy="419" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="405" x2="554" y2="433" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="405" x2="526" y2="433" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="453" text-anchor="middle" font-size="9" fill="#fbbf24">Light 4</text>

  <!-- NO to LIGHT wires (orange) -->
  <line x1="360" y1="208" x2="520" y2="200" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="281" x2="520" y2="273" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="354" x2="520" y2="346" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="427" x2="520" y2="419" stroke="#f97316" stroke-width="1.5"/>

  <!-- GND RETURN (lights to rail) -->
  <line x1="565" y1="220" x2="565" y2="490" stroke="#5a6270" stroke-width="2"/>
  <line x1="540" y1="220" x2="565" y2="220" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="293" x2="565" y2="293" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="366" x2="565" y2="366" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="439" x2="565" y2="439" stroke="#5a6270" stroke-width="1.5"/>

  <!-- COIL POWER NOTE -->
  <rect x="18" y="462" width="215" height="36" rx="3" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="125" y="476" text-anchor="middle" font-size="9" fill="#9ca3af">relay coil (per module, not shown):</text>
  <text x="125" y="490" text-anchor="middle" font-size="9" fill="#9ca3af">VCC → ESP32 3V3  ·  GND → ESP32 GND</text>

  <!-- LEGEND -->
  <rect x="608" y="155" width="142" height="135" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="679" y="172" text-anchor="middle" font-size="10" fill="#9ca3af" font-weight="bold">Legend</text>
  <line x1="618" y1="188" x2="640" y2="188" stroke="#3b82f6" stroke-width="2"/>
  <text x="645" y="192" font-size="9" fill="#3b82f6">signal (GPIO→IN)</text>
  <line x1="618" y1="207" x2="640" y2="207" stroke="#e74c3c" stroke-width="2"/>
  <text x="645" y="211" font-size="9" fill="#e74c3c">+12V / COM</text>
  <line x1="618" y1="226" x2="640" y2="226" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="645" y="230" font-size="9" fill="#e74c3c">daisy-chain jumper</text>
  <line x1="618" y1="245" x2="640" y2="245" stroke="#f97316" stroke-width="2"/>
  <text x="645" y="249" font-size="9" fill="#f97316">NO → load</text>
  <line x1="618" y1="264" x2="640" y2="264" stroke="#5a6270" stroke-width="2"/>
  <text x="645" y="268" font-size="9" fill="#5a6270">GND return</text>

</svg>
