<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" font-family="'Courier New', monospace">

  <!-- Background -->
  <rect width="760" height="570" fill="#1a1e2e"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#cdd6f4">ESP-B v1.5 — 4-Relay Load Wiring (Rear)</text>

  <!-- +12V load rail -->
  <line x1="373" y1="50" x2="585" y2="50" stroke="#e74c3c" stroke-width="3"/>
  <text x="368" y="45" font-size="10" fill="#e74c3c" text-anchor="end" font-weight="bold">+12V</text>
  <text x="368" y="57" font-size="9" fill="#a33" text-anchor="end">(batt +)</text>

  <!-- GND load rail -->
  <line x1="373" y1="510" x2="585" y2="510" stroke="#5a6270" stroke-width="3"/>
  <text x="368" y="514" font-size="10" fill="#5a6270" text-anchor="end">GND (batt −)</text>

  <!-- ESP32-B block -->
  <rect x="20" y="100" width="118" height="345" rx="6" fill="#162844" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="79" y="119" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">ESP32-B</text>

  <!-- GPIO 4 (Relay 1) -->
  <circle cx="138" cy="170" r="3.5" fill="#3b82f6"/>
  <text x="130" y="167" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 4</text>
  <text x="130" y="178" font-size="8" fill="#4a6fa5" text-anchor="end">Ch1</text>

  <!-- GPIO 32 (Relay 2) -->
  <circle cx="138" cy="243" r="3.5" fill="#3b82f6"/>
  <text x="130" y="240" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 32</text>
  <text x="130" y="251" font-size="8" fill="#4a6fa5" text-anchor="end">Ch2</text>

  <!-- GPIO 33 (Relay 3) -->
  <circle cx="138" cy="316" r="3.5" fill="#3b82f6"/>
  <text x="130" y="313" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 33</text>
  <text x="130" y="324" font-size="8" fill="#4a6fa5" text-anchor="end">Ch3</text>

  <!-- GPIO 25 (Relay 4) -->
  <circle cx="138" cy="389" r="3.5" fill="#3b82f6"/>
  <text x="130" y="386" font-size="9" fill="#93c5fd" text-anchor="end">GPIO 25</text>
  <text x="130" y="397" font-size="8" fill="#4a6fa5" text-anchor="end">Ch4</text>

  <!-- GPIO 26 (Brake) -->
  <circle cx="138" cy="430" r="3.5" fill="#a78bfa"/>
  <text x="130" y="427" font-size="9" fill="#c4b5fd" text-anchor="end">GPIO 26</text>
  <text x="130" y="438" font-size="8" fill="#7c6fa5" text-anchor="end">brake</text>

  <!-- GPIO 2 LED note (internal, no wire) -->
  <text x="79" y="458" text-anchor="middle" font-size="8" fill="#374151">GPIO 2 → onboard LED</text>

  <!-- RELAY 1 (center y=170) -->
  <rect x="240" y="140" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="166" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 1</text>
  <text x="300" y="179" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch1 / GPIO 4</text>
  <circle cx="240" cy="170" r="3" fill="#4ade80"/>
  <text x="244" y="167" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="156" r="3" fill="#e74c3c"/>
  <text x="365" y="160" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="178" r="3" fill="#f97316"/>
  <text x="365" y="182" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 2 (center y=243) -->
  <rect x="240" y="213" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="239" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 2</text>
  <text x="300" y="252" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch2 / GPIO 32</text>
  <circle cx="240" cy="243" r="3" fill="#4ade80"/>
  <text x="244" y="240" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="229" r="3" fill="#e74c3c"/>
  <text x="365" y="233" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="251" r="3" fill="#f97316"/>
  <text x="365" y="255" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 3 (center y=316) -->
  <rect x="240" y="286" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="312" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 3</text>
  <text x="300" y="325" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch3 / GPIO 33</text>
  <circle cx="240" cy="316" r="3" fill="#4ade80"/>
  <text x="244" y="313" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="302" r="3" fill="#e74c3c"/>
  <text x="365" y="306" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="324" r="3" fill="#f97316"/>
  <text x="365" y="328" font-size="8" fill="#f97316">NO</text>

  <!-- RELAY 4 (center y=389) -->
  <rect x="240" y="359" width="120" height="60" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="385" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">RELAY 4</text>
  <text x="300" y="398" text-anchor="middle" font-size="8" fill="#2d6a2d">Ch4 / GPIO 25</text>
  <circle cx="240" cy="389" r="3" fill="#4ade80"/>
  <text x="244" y="386" font-size="8" fill="#4ade80">IN</text>
  <circle cx="360" cy="375" r="3" fill="#e74c3c"/>
  <text x="365" y="379" font-size="8" fill="#e74c3c">COM</text>
  <circle cx="360" cy="397" r="3" fill="#f97316"/>
  <text x="365" y="401" font-size="8" fill="#f97316">NO</text>

  <!-- SIGNAL WIRES (GPIO to IN, blue) -->
  <line x1="138" y1="170" x2="240" y2="170" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="243" x2="240" y2="243" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="316" x2="240" y2="316" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="138" y1="389" x2="240" y2="389" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- +12V DAISY CHAIN -->
  <line x1="373" y1="50" x2="373" y2="156" stroke="#e74c3c" stroke-width="2"/>
  <line x1="360" y1="156" x2="373" y2="156" stroke="#e74c3c" stroke-width="2"/>
  <line x1="373" y1="156" x2="373" y2="229" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="229" x2="373" y2="229" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="373" y1="229" x2="373" y2="302" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="302" x2="373" y2="302" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="373" y1="302" x2="373" y2="375" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="360" y1="375" x2="373" y2="375" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- LIGHTS -->
  <circle cx="540" cy="170" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="156" x2="554" y2="184" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="156" x2="526" y2="184" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="204" text-anchor="middle" font-size="9" fill="#fbbf24">Light 1</text>

  <circle cx="540" cy="243" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="229" x2="554" y2="257" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="229" x2="526" y2="257" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="277" text-anchor="middle" font-size="9" fill="#fbbf24">Light 2</text>

  <circle cx="540" cy="316" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="302" x2="554" y2="330" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="302" x2="526" y2="330" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="350" text-anchor="middle" font-size="9" fill="#fbbf24">Light 3</text>

  <circle cx="540" cy="389" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="526" y1="375" x2="554" y2="403" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="554" y1="375" x2="526" y2="403" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="423" text-anchor="middle" font-size="9" fill="#fbbf24">Light 4</text>

  <!-- NO to LIGHT wires (orange) -->
  <line x1="360" y1="178" x2="520" y2="170" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="251" x2="520" y2="243" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="324" x2="520" y2="316" stroke="#f97316" stroke-width="1.5"/>
  <line x1="360" y1="397" x2="520" y2="389" stroke="#f97316" stroke-width="1.5"/>

  <!-- GND RETURN (lights to rail) -->
  <line x1="565" y1="190" x2="565" y2="510" stroke="#5a6270" stroke-width="2"/>
  <line x1="540" y1="190" x2="565" y2="190" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="263" x2="565" y2="263" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="336" x2="565" y2="336" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="540" y1="409" x2="565" y2="409" stroke="#5a6270" stroke-width="1.5"/>

  <!-- BRAKE SWITCH -->
  <line x1="138" y1="430" x2="248" y2="430" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="248" y="416" width="96" height="28" rx="4" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="296" y="428" text-anchor="middle" font-size="9" fill="#c4b5fd">brake</text>
  <text x="296" y="439" text-anchor="middle" font-size="9" fill="#c4b5fd">switch</text>
  <line x1="344" y1="430" x2="370" y2="430" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Drop to GND symbol -->
  <line x1="370" y1="430" x2="370" y2="468" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="355" y1="468" x2="385" y2="468" stroke="#5a6270" stroke-width="2"/>
  <line x1="360" y1="474" x2="380" y2="474" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="364" y1="480" x2="376" y2="480" stroke="#5a6270" stroke-width="1"/>
  <text x="370" y="494" text-anchor="middle" font-size="8" fill="#5a6270">GND</text>

  <!-- COIL POWER NOTE -->
  <rect x="18" y="502" width="215" height="36" rx="3" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="125" y="516" text-anchor="middle" font-size="9" fill="#9ca3af">relay coil (per module, not shown):</text>
  <text x="125" y="530" text-anchor="middle" font-size="9" fill="#9ca3af">VCC → ESP32 3V3  ·  GND → ESP32 GND</text>

  <!-- LEGEND -->
  <rect x="608" y="120" width="142" height="155" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="679" y="137" text-anchor="middle" font-size="10" fill="#9ca3af" font-weight="bold">Legend</text>
  <line x1="618" y1="153" x2="640" y2="153" stroke="#3b82f6" stroke-width="2"/>
  <text x="645" y="157" font-size="9" fill="#3b82f6">signal (GPIO→IN)</text>
  <line x1="618" y1="172" x2="640" y2="172" stroke="#e74c3c" stroke-width="2"/>
  <text x="645" y="176" font-size="9" fill="#e74c3c">+12V / COM</text>
  <line x1="618" y1="191" x2="640" y2="191" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="645" y="195" font-size="9" fill="#e74c3c">daisy-chain jumper</text>
  <line x1="618" y1="210" x2="640" y2="210" stroke="#f97316" stroke-width="2"/>
  <text x="645" y="214" font-size="9" fill="#f97316">NO → load</text>
  <line x1="618" y1="229" x2="640" y2="229" stroke="#5a6270" stroke-width="2"/>
  <text x="645" y="233" font-size="9" fill="#5a6270">GND return</text>
  <line x1="618" y1="248" x2="640" y2="248" stroke="#a78bfa" stroke-width="2"/>
  <text x="645" y="252" font-size="9" fill="#a78bfa">brake switch</text>

</svg>
