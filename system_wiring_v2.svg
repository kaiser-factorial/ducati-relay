<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" font-family="'Courier New', monospace">
  <!-- Background -->
  <rect width="1000" height="600" fill="#1a1e2e"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#cdd6f4">Ducati Relay System v2.0 — Full Wiring Diagram</text>

  <!-- ================= BOARD A (FRONT) ================= -->
  <!-- ESP32-A -->
  <rect x="150" y="60" width="140" height="500" rx="6" fill="#162844" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="85" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="bold">ESP32 (Board A)</text>
  <text x="220" y="100" text-anchor="middle" font-size="10" fill="#93c5fd">Front</text>

  <!-- MCP2515-A -->
  <rect x="360" y="130" width="80" height="200" rx="4" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="bold">MCP2515</text>

  <!-- Buttons Block A -->
  <rect x="10" y="80" width="110" height="280" rx="4" fill="#1f2937" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#d1d5db" font-weight="bold">Push Buttons</text>
  <text x="65" y="115" text-anchor="middle" font-size="9" fill="#9ca3af">(To GND)</text>
  
  <!-- Relays Block A -->
  <rect x="10" y="380" width="110" height="160" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="65" y="400" text-anchor="middle" font-size="11" fill="#4ade80" font-weight="bold">Front Relays</text>

  <!-- Buttons Lines A -->
  <!-- Power -->
  <line x1="120" y1="130" x2="150" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="133" text-anchor="end" font-size="10" fill="#9ca3af">Power (Ign)</text>
  <text x="155" y="133" text-anchor="start" font-size="10" fill="#93c5fd">27</text>
  <!-- Starter -->
  <line x1="120" y1="160" x2="150" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="163" text-anchor="end" font-size="10" fill="#9ca3af">Starter</text>
  <text x="155" y="163" text-anchor="start" font-size="10" fill="#93c5fd">25</text>
  <!-- HdLo -->
  <line x1="120" y1="190" x2="150" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="193" text-anchor="end" font-size="10" fill="#9ca3af">HeadLo</text>
  <text x="155" y="193" text-anchor="start" font-size="10" fill="#93c5fd">26</text>
  <!-- HdHi -->
  <line x1="120" y1="220" x2="150" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="223" text-anchor="end" font-size="10" fill="#9ca3af">HeadHi</text>
  <text x="155" y="223" text-anchor="start" font-size="10" fill="#93c5fd">14</text>
  <!-- TurnL -->
  <line x1="120" y1="250" x2="150" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="253" text-anchor="end" font-size="10" fill="#9ca3af">Turn L</text>
  <text x="155" y="253" text-anchor="start" font-size="10" fill="#93c5fd">13</text>
  <!-- TurnR -->
  <line x1="120" y1="280" x2="150" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="283" text-anchor="end" font-size="10" fill="#9ca3af">Turn R</text>
  <text x="155" y="283" text-anchor="start" font-size="10" fill="#93c5fd">17</text>
  <!-- Stereo -->
  <line x1="120" y1="310" x2="150" y2="310" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="313" text-anchor="end" font-size="10" fill="#9ca3af">Stereo</text>
  <text x="155" y="313" text-anchor="start" font-size="10" fill="#93c5fd">22</text>

  <!-- Relays Lines A -->
  <!-- Ign -->
  <line x1="120" y1="430" x2="150" y2="430" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="433" text-anchor="end" font-size="10" fill="#4ade80">Ignition</text>
  <text x="155" y="433" text-anchor="start" font-size="10" fill="#93c5fd">4</text>
  <!-- Start -->
  <line x1="120" y1="460" x2="150" y2="460" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="463" text-anchor="end" font-size="10" fill="#4ade80">Starter</text>
  <text x="155" y="463" text-anchor="start" font-size="10" fill="#93c5fd">32</text>
  <!-- HdLo -->
  <line x1="120" y1="490" x2="150" y2="490" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="493" text-anchor="end" font-size="10" fill="#4ade80">HeadLo</text>
  <text x="155" y="493" text-anchor="start" font-size="10" fill="#93c5fd">33</text>
  <!-- HdHi -->
  <line x1="120" y1="520" x2="150" y2="520" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="523" text-anchor="end" font-size="10" fill="#4ade80">HeadHi</text>
  <text x="155" y="523" text-anchor="start" font-size="10" fill="#93c5fd">16</text>


  <!-- SPI Lines A -->
  <!-- 3.3V -->
  <line x1="290" y1="170" x2="360" y2="170" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="285" y="173" text-anchor="end" font-size="10" fill="#e74c3c">3V3</text>
  <text x="365" y="173" text-anchor="start" font-size="10" fill="#e74c3c">VCC</text>
  <!-- GND -->
  <line x1="290" y1="200" x2="360" y2="200" stroke="#5a6270" stroke-width="1.5"/>
  <text x="285" y="203" text-anchor="end" font-size="10" fill="#5a6270">GND</text>
  <text x="365" y="203" text-anchor="start" font-size="10" fill="#5a6270">GND</text>
  <!-- CS -->
  <line x1="290" y1="230" x2="360" y2="230" stroke="#a855f7" stroke-width="1.5"/>
  <text x="285" y="233" text-anchor="end" font-size="10" fill="#a855f7">GPIO 5</text>
  <text x="365" y="233" text-anchor="start" font-size="10" fill="#a855f7">CS</text>
  <!-- SCK -->
  <line x1="290" y1="260" x2="360" y2="260" stroke="#10b981" stroke-width="1.5"/>
  <text x="285" y="263" text-anchor="end" font-size="10" fill="#10b981">GPIO 18</text>
  <text x="365" y="263" text-anchor="start" font-size="10" fill="#10b981">SCK</text>
  <!-- MISO -->
  <line x1="290" y1="290" x2="360" y2="290" stroke="#ec4899" stroke-width="1.5"/>
  <text x="285" y="293" text-anchor="end" font-size="10" fill="#ec4899">GPIO 19</text>
  <text x="365" y="293" text-anchor="start" font-size="10" fill="#ec4899">SO</text>
  <!-- MOSI -->
  <line x1="290" y1="320" x2="360" y2="320" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="285" y="323" text-anchor="end" font-size="10" fill="#06b6d4">GPIO 23</text>
  <text x="365" y="323" text-anchor="start" font-size="10" fill="#06b6d4">SI</text>

  <!-- ================= CAN BUS ================= -->
  <!-- CAN H -->
  <line x1="440" y1="200" x2="560" y2="200" stroke="#facc15" stroke-width="2.5"/>
  <text x="500" y="195" text-anchor="middle" font-size="11" fill="#facc15" font-weight="bold">CAN H</text>
  <text x="435" y="203" text-anchor="end" font-size="10" fill="#facc15">H</text>
  <text x="565" y="203" text-anchor="start" font-size="10" fill="#facc15">H</text>
  <!-- CAN L -->
  <line x1="440" y1="250" x2="560" y2="250" stroke="#22c55e" stroke-width="2.5"/>
  <text x="500" y="245" text-anchor="middle" font-size="11" fill="#22c55e" font-weight="bold">CAN L</text>
  <text x="435" y="253" text-anchor="end" font-size="10" fill="#22c55e">L</text>
  <text x="565" y="253" text-anchor="start" font-size="10" fill="#22c55e">L</text>


  <!-- ================= BOARD B (REAR) ================= -->
  <!-- MCP2515-B -->
  <rect x="560" y="130" width="80" height="200" rx="4" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="bold">MCP2515</text>

  <!-- ESP32-B -->
  <rect x="710" y="60" width="140" height="500" rx="6" fill="#162844" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="780" y="85" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="bold">ESP32 (Board B)</text>
  <text x="780" y="100" text-anchor="middle" font-size="10" fill="#93c5fd">Rear</text>

  <!-- Relays Block B -->
  <rect x="880" y="380" width="110" height="160" rx="4" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="935" y="400" text-anchor="middle" font-size="11" fill="#4ade80" font-weight="bold">Rear Relays</text>

  <!-- SPI Lines B -->
  <!-- 3.3V -->
  <line x1="640" y1="170" x2="710" y2="170" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="635" y="173" text-anchor="end" font-size="10" fill="#e74c3c">VCC</text>
  <text x="715" y="173" text-anchor="start" font-size="10" fill="#e74c3c">3V3</text>
  <!-- GND -->
  <line x1="640" y1="200" x2="710" y2="200" stroke="#5a6270" stroke-width="1.5"/>
  <text x="635" y="203" text-anchor="end" font-size="10" fill="#5a6270">GND</text>
  <text x="715" y="203" text-anchor="start" font-size="10" fill="#5a6270">GND</text>
  <!-- CS -->
  <line x1="640" y1="230" x2="710" y2="230" stroke="#a855f7" stroke-width="1.5"/>
  <text x="635" y="233" text-anchor="end" font-size="10" fill="#a855f7">CS</text>
  <text x="715" y="233" text-anchor="start" font-size="10" fill="#a855f7">GPIO 5</text>
  <!-- SCK -->
  <line x1="640" y1="260" x2="710" y2="260" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="263" text-anchor="end" font-size="10" fill="#10b981">SCK</text>
  <text x="715" y="263" text-anchor="start" font-size="10" fill="#10b981">GPIO 18</text>
  <!-- MISO -->
  <line x1="640" y1="290" x2="710" y2="290" stroke="#ec4899" stroke-width="1.5"/>
  <text x="635" y="293" text-anchor="end" font-size="10" fill="#ec4899">SO</text>
  <text x="715" y="293" text-anchor="start" font-size="10" fill="#ec4899">GPIO 19</text>
  <!-- MOSI -->
  <line x1="640" y1="320" x2="710" y2="320" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="635" y="323" text-anchor="end" font-size="10" fill="#06b6d4">SI</text>
  <text x="715" y="323" text-anchor="start" font-size="10" fill="#06b6d4">GPIO 23</text>

  <!-- Relays Lines B -->
  <!-- TurnL -->
  <line x1="850" y1="430" x2="880" y2="430" stroke="#4ade80" stroke-width="1.5"/>
  <text x="845" y="433" text-anchor="end" font-size="10" fill="#93c5fd">4</text>
  <text x="885" y="433" text-anchor="start" font-size="10" fill="#4ade80">Turn L</text>
  <!-- TurnR -->
  <line x1="850" y1="460" x2="880" y2="460" stroke="#4ade80" stroke-width="1.5"/>
  <text x="845" y="463" text-anchor="end" font-size="10" fill="#93c5fd">32</text>
  <text x="885" y="463" text-anchor="start" font-size="10" fill="#4ade80">Turn R</text>
  <!-- Brake -->
  <line x1="850" y1="490" x2="880" y2="490" stroke="#4ade80" stroke-width="1.5"/>
  <text x="845" y="493" text-anchor="end" font-size="10" fill="#93c5fd">33</text>
  <text x="885" y="493" text-anchor="start" font-size="10" fill="#4ade80">Brake</text>
  <!-- Stereo -->
  <line x1="850" y1="520" x2="880" y2="520" stroke="#4ade80" stroke-width="1.5"/>
  <text x="845" y="523" text-anchor="end" font-size="10" fill="#93c5fd">25</text>
  <text x="885" y="523" text-anchor="start" font-size="10" fill="#4ade80">Stereo</text>

</svg>
